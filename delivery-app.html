<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partner App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #1f2937; margin-bottom: 5px; }
        p { color: #6b7280; font-size: 0.9rem; margin-bottom: 20px; }
        input {
            width: 80%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        .pin-input { font-size: 1.5rem; text-align: center; letter-spacing: 5px; }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:active { background-color: #2563eb; }
        .btn-green { background-color: #10b981; }
        .btn-green:active { background-color: #059669; }
        .btn-red { background-color: #ef4444; margin-top: 20px; }
        #status-msg, #login-error { margin-top: 15px; font-weight: bold; font-size: 1rem; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        
        /* Sections */
        #app-section { display: none; } /* ऐप सेक्शन शुरुआत में छिपा रहेगा */
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= LOGIN SECTION ================= -->
        <div id="login-section">
            <h2><i class="fas fa-lock"></i> Staff Login</h2>
            <p>Please login to access delivery portal.</p>
            
            <input type="email" id="email-input" placeholder="Email Address">
            <input type="password" id="password-input" placeholder="Password">
            
            <button onclick="loginUser()" id="login-btn">Login</button>
            <div id="login-error" class="error"></div>
        </div>

        <!-- ================= VERIFICATION SECTION ================= -->
        <div id="app-section">
            <h2><i class="fas fa-truck"></i> Verify Delivery</h2>
            <p id="user-email-display" style="color: #3b82f6; font-weight: bold; margin-bottom: 20px;"></p>
            
            <input type="tel" id="phone-input" placeholder="Customer Phone No.">
            <input type="number" id="pin-input" class="pin-input" placeholder="XXXX" maxlength="4">
            
            <button class="btn-green" id="verify-btn" onclick="verifyAndDeliver()"><i class="fas fa-check-circle"></i> Verify & Deliver</button>
            <div id="status-msg"></div>

            <button class="btn-red" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

    </div>

    <!-- Firebase SDKs (Auth added) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
 
 const firebaseConfig = {
  apiKey: "AIzaSyDZqKpIPtARoX6xLZtbTRVRWn-GblEyWKg",
  authDomain: "thelocalshop-db-7de5b.firebaseapp.com",
  projectId: "thelocalshop-db-7de5b",
  storageBucket: "thelocalshop-db-7de5b.firebasestorage.app",
  messagingSenderId: "296983976077",
  appId: "1:296983976077:web:94a0b6c53e9f9082ef2ac4"
};
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 1. Check Login Status (Listen for state changes)
        auth.onAuthStateChanged((user) => {
            if (user) {
                // अगर यूज़र लॉगिन है, तो ऐप दिखाएं और लॉगिन छिपाएं
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('app-section').style.display = 'block';
                document.getElementById('user-email-display').innerText = "Logged in as: " + user.email;
            } else {
                // अगर लॉगिन नहीं है, तो लॉगिन स्क्रीन दिखाएं
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('app-section').style.display = 'none';
            }
        });

        // 2. Login Function
        function loginUser() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');

            if(!email || !password) {
                errorDiv.innerText = "Please enter both email and password.";
                return;
            }

            btn.innerText = "Logging in...";
            errorDiv.innerText = "";

            auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                btn.innerText = "Login"; // UI अपने आप चेंज हो जाएगा State Observer की वजह से
            })
            .catch((error) => {
                btn.innerText = "Login";
                errorDiv.innerText = error.message;
            });
        }

        // 3. Logout Function
        function logoutUser() {
            auth.signOut().then(() => {
                // इनपुट बॉक्सेस को खाली कर दें
                document.getElementById('phone-input').value = '';
                document.getElementById('pin-input').value = '';
                document.getElementById('status-msg').innerHTML = '';
            });
        }

        // 4. Verify & Deliver Function (फ़ोन और पिन दोनों के साथ)
        function verifyAndDeliver() {
            const phoneValue = document.getElementById('phone-input').value;
            const pinInputValue = document.getElementById('pin-input').value;
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('verify-btn');
            const enteredPin = parseInt(pinInputValue);

            if (!phoneValue || !enteredPin || pinInputValue.length !== 4) {
                statusMsg.innerHTML = '<span class="error">Please enter valid Phone and 4-digit PIN!</span>';
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            btn.disabled = true;
            statusMsg.innerHTML = '';

            // फायरबेस में चेक करें
            db.collection("orders")
              .where("customerPhone", "==", phoneValue)
              .where("secretPin", "==", enteredPin)
              .get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    statusMsg.innerHTML = '<span class="error"><i class="fas fa-times-circle"></i> Invalid Phone or PIN. No matching order found.</span>';
                    resetBtn(btn);
                    return;
                }

                // आर्डर मिल गया, अब डिलीवर मार्क करें
                querySnapshot.forEach((doc) => {
                    db.collection("orders").doc(doc.id).update({
                        status: "Delivered",
                        deliveredBy: auth.currentUser.email, // किसने डिलीवर किया, वो भी सेव होगा
                        deliveryTime: new Date().toLocaleString()
                    })
                    .then(() => {
                        statusMsg.innerHTML = `<span class="success"><i class="fas fa-check-double"></i> Success! Order for ${doc.data().customerName} marked as Delivered!</span>`;
                        document.getElementById('pin-input').value = ''; 
                        document.getElementById('phone-input').value = ''; 
                        resetBtn(btn);
                    });
                });
            })
            .catch((error) => {
                statusMsg.innerHTML = '<span class="error">Error connecting to database.</span>';
                resetBtn(btn);
            });
        }

        function resetBtn(btn) {
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Deliver';
            btn.disabled = false;
        }
    </script>
</body>
</html>
